<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #777;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── HOME ── */
    #home {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
      padding: 60px 20px;
      width: 100%;
      max-width: 700px;
    }

    #home header {
      text-align: center;
    }

    #home header h1 {
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #333;
    }

    .tools {
      display: flex;
      flex-direction: column;
      gap: 1px;
      width: 100%;
    }

    .tool-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
      border-bottom: 1px solid #1a1a1a;
      text-decoration: none;
      color: #777;
      transition: color 0.2s;
      gap: 20px;
    }

    .tool-card:first-child { border-top: 1px solid #1a1a1a; }

    .tool-card:hover { color: #bbb; }

    .tool-info { flex: 1; }

    .tool-name {
      font-size: 22px;
      font-weight: normal;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .tool-desc {
      font-size: 12px;
      letter-spacing: 1px;
      color: #3a3a3a;
    }

    .tool-arrow {
      font-size: 18px;
      color: #2a2a2a;
      transition: color 0.2s, transform 0.2s;
    }

    .tool-card:hover .tool-arrow { color: #666; transform: translateX(4px); }
  </style>
</head>
<body>

  <div id="home">
    <header>
      <h1>Tools</h1>
    </header>

    <div class="tools">
      <a class="tool-card" href="Discogs.html">
        <div class="tool-info">
          <div class="tool-name">Discogs</div>
          <div class="tool-desc">Random de colección — descubre tu próxima escucha</div>
        </div>
        <span class="tool-arrow">→</span>
      </a>

      <a class="tool-card" href="Artist.html">
        <div class="tool-info">
          <div class="tool-name">Artist</div>
          <div class="tool-desc">Randomizador de artistas — elige uno al azar</div>
        </div>
        <span class="tool-arrow">→</span>
      </a>

      <a class="tool-card" href="Idea.html">
        <div class="tool-info">
          <div class="tool-name">Idea</div>
          <div class="tool-desc">Randomizador creativo — punto de partida para producir</div>
        </div>
        <span class="tool-arrow">→</span>
      </a>
    </div>
  </div>


</body>
</html>
