<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Randomizador creativo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 140px;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 24px;
    }

    .phrase {
      font-size: 80px;
      margin-bottom: 32px;
      min-height: 60px;
    }

    button {
      font-size: 16px;
      padding: 12px 24px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="phrase" class="phrase">
      Pulsa el botón
    </div>
    <button onclick="randomize()">
      Randomizar
    </button>
  </div>

  <script>
    const phrases = [
      "Drums secuenciadas",
      "Loop drum",
      "Copiar cancion 1:1",
      "Copiar estructura cancion",
      "Bajo de cancion",
      "Bajo de loop",
      "Drums de cancion",
      "Bajo compuesto",
      "Acordes de midi",
      "Acordes tocados",
      "Acordes robados",
      "Melodia midi",
      "Melodia tocada",
      "Melodia robada",
      "Loop ins",
      "Tiktok",
      "Nota constante",
      "Chopear loop ins",
      "Chopear loop",
      "Chopear vocal",
      "Acapella famosa",
      "Acapella random",
      "Loop vocal",
      "Foley",
      "Youtube sound (My boy)",
      "Pasar algo por melodyne",
      "Reverse",
      "Microchop",
      "Loop 4 bars",
      "Chopear acordes",
      "Arpegio",
      "Radio",
      "Acordes solo 7th",
      "Acordes con menos notas",
      "Garageband",
      "Sound design",
      "From Tutorial",
      "Trick from Figma",
      "Frase de un libro",
      "Song reference",
      "Estructura robada",
      "No empezar en el 1 (Sincopas)",
      "Tema sin bateria",
      "Tema sin voz",
      "Tema sin acordes",
      "Tema sin melodia"
    ];

    function randomize() {
      const randomIndex = Math.floor(Math.random() * phrases.length);
      document.getElementById("phrase").textContent = phrases[randomIndex];
    }
  </script>

</body>
</html>
