<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Discogs Random</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080808;
      --surface: #111;
      --border: #383838;
      --muted: #585858;
      --dim: #888;
      --mid: #bbb;
      --light: #ddd;
      --white: #f5f5f5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      background: var(--bg);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── Background ── */
    #bg-a, #bg-b {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 1.4s ease;
      z-index: 0;
    }

    #bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(8,8,8,0.88) 0%, rgba(8,8,8,0.96) 100%);
      z-index: 1;
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 2;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 20px;
      padding-bottom: 60px;
      padding-bottom: calc(60px + env(safe-area-inset-bottom));
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 24px;
      padding-top: calc(20px + env(safe-area-inset-top));
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--dim);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.2s;
      padding: 8px 0;
    }

    .back-btn:hover { color: var(--mid); }

    .back-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    .page-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Filters accordion ── */
    .filters-toggle {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 16px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      margin-bottom: 2px;
    }

    .filters-toggle:hover { border-color: var(--muted); color: var(--mid); }

    .filters-toggle .arrow {
      font-size: 16px;
      transition: transform 0.25s ease;
      display: inline-block;
    }

    .filters-toggle.open .arrow { transform: rotate(180deg); }

    .filters-body {
      display: none;
      flex-direction: column;
      gap: 0;
      border: 1px solid var(--border);
      border-top: none;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .filters-body.open { display: flex; }

    .filter-section {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .filter-section:last-child { border-bottom: none; }

    .filter-label {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      display: block;
    }

    /* Genre grid */
    .genre-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }

    .genre-check {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.5px;
      min-height: 40px;
      padding: 4px 0;
      user-select: none;
      transition: color 0.15s;
    }

    .genre-check:hover { color: var(--mid); }

    .genre-check input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid var(--muted);
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
    }

    .genre-check input[type="checkbox"]:checked {
      border-color: var(--mid);
      background: var(--mid);
    }

    .genre-check input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: 2px solid #0e0e0e;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    /* Year range */
    .year-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .year-input-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .year-sub {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .year-input-wrap input[type="number"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--light);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 16px;
      padding: 12px 12px;
      text-align: center;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      transition: border-color 0.15s;
    }

    .year-input-wrap input[type="number"]:focus { border-color: var(--muted); }

    .year-dash {
      color: var(--muted);
      font-size: 16px;
      padding-top: 22px;
      flex-shrink: 0;
    }

    /* Exclude */
    .exclude-input {
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--mid);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 10px 0;
      outline: none;
      transition: border-color 0.15s;
    }

    .exclude-input:focus { border-color: var(--dim); }
    .exclude-input::placeholder { color: var(--muted); }

    #excludeTags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .tag {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      padding: 0;
      line-height: 1;
      transition: color 0.15s;
    }

    .tag button:hover { color: var(--mid); }

    /* ── Main button ── */
    #mainBtn {
      width: 100%;
      height: 56px;
      background: none;
      border: 1px solid var(--mid);
      color: var(--mid);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      margin-bottom: 32px;
    }

    #mainBtn:hover:not(:disabled) {
      background: var(--mid);
      color: #0e0e0e;
    }

    #mainBtn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ── Status ── */
    #status {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--dim);
      text-align: center;
      min-height: 20px;
      margin-bottom: 24px;
    }

    /* ── Card ── */
    #card {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #cover {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1;
      object-fit: cover;
      margin-bottom: 28px;
      display: none;
    }

    #cover-placeholder {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .card-meta {
      width: 100%;
      text-align: center;
      margin-bottom: 6px;
    }

    #artist {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 6px;
    }

    #album {
      font-family: 'Cormorant', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--dim);
      margin-bottom: 24px;
    }

    #track {
      font-family: 'Cormorant', serif;
      font-weight: 300;
      font-size: clamp(36px, 11vw, 56px);
      line-height: 1.1;
      color: var(--white);
      text-align: center;
      width: 100%;
      margin-bottom: 32px;
    }

    /* ── Styles ── */
    #stylesSection { display: none; }

    .style-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }

    /* ── Presets ── */
    .presets-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 16px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .presets-row::-webkit-scrollbar { display: none; }

    .preset-chip {
      flex-shrink: 0;
      height: 36px;
      padding: 0 14px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .preset-chip:hover {
      border-color: var(--dim);
      color: var(--dim);
    }

    .preset-chip.active {
      border-color: var(--mid);
      color: var(--mid);
      background: rgba(119,119,119,0.08);
    }

    /* ── Links ── */
    .links {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .links a {
      flex: 1;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .links a:hover {
      border-color: var(--dim);
      color: var(--mid);
    }
  </style>
</head>
<body>

  <div id="bg-a"></div>
  <div id="bg-b"></div>
  <div id="bg-overlay"></div>

  <div class="page">
    <!-- Top bar -->
    <div class="topbar">
      <a class="back-btn" href="index.html">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 2L4 7l5 5"/>
        </svg>
        Volver
      </a>
      <span class="page-title">Discogs</span>
    </div>

    <!-- Presets -->
    <div class="presets-row" id="presetsRow"></div>

    <!-- Filters -->
    <button class="filters-toggle" id="filtersToggle" onclick="toggleFilters()">
      <span>Filtros</span>
      <span class="arrow">▾</span>
    </button>

    <div class="filters-body" id="filtersBody">

      <div class="filter-section">
        <span class="filter-label">Género</span>
        <div class="genre-grid" id="genreList">
          <label class="genre-check"><input type="checkbox" value="Blues"> Blues</label>
          <label class="genre-check"><input type="checkbox" value="Classical"> Classical</label>
          <label class="genre-check"><input type="checkbox" value="Electronic"> Electronic</label>
          <label class="genre-check"><input type="checkbox" value="Folk, World, &amp; Country"> Folk &amp; World</label>
          <label class="genre-check"><input type="checkbox" value="Funk / Soul"> Funk / Soul</label>
          <label class="genre-check"><input type="checkbox" value="Hip Hop"> Hip Hop</label>
          <label class="genre-check"><input type="checkbox" value="Jazz"> Jazz</label>
          <label class="genre-check"><input type="checkbox" value="Latin"> Latin</label>
          <label class="genre-check"><input type="checkbox" value="Pop"> Pop</label>
          <label class="genre-check"><input type="checkbox" value="Reggae"> Reggae</label>
          <label class="genre-check"><input type="checkbox" value="Rock"> Rock</label>
          <label class="genre-check"><input type="checkbox" value="Brass &amp; Military"> Brass</label>
          <label class="genre-check"><input type="checkbox" value="Stage &amp; Screen"> Stage</label>
          <label class="genre-check"><input type="checkbox" value="Non-Music"> Non-Music</label>
        </div>
      </div>

      <div class="filter-section" id="stylesSection">
        <span class="filter-label">Estilo (vacío = todos)</span>
        <div class="style-grid" id="styleList"></div>
      </div>

      <div class="filter-section">
        <span class="filter-label">Año</span>
        <div class="year-row">
          <div class="year-input-wrap">
            <span class="year-sub">Desde</span>
            <input type="number" id="yearFrom" value="1960" min="1900" max="2024">
          </div>
          <span class="year-dash">—</span>
          <div class="year-input-wrap">
            <span class="year-sub">Hasta</span>
            <input type="number" id="yearTo" value="2010" min="1900" max="2024">
          </div>
        </div>
      </div>

      <div class="filter-section">
        <span class="filter-label">Excluir estilos</span>
        <input type="text" class="exclude-input" id="excludeInput"
               placeholder="Heavy Metal, Punk…"
               onkeydown="handleExcludeKey(event)">
        <div id="excludeTags"></div>
      </div>

    </div>

    <!-- Main button -->
    <button id="mainBtn" onclick="getRandomTrack()">Random</button>

    <!-- Status -->
    <div id="status"></div>

    <!-- Card -->
    <div id="card">
      <img id="cover" src="" alt="Portada">
      <div id="cover-placeholder">Sin portada</div>
      <div class="card-meta">
        <div id="artist"></div>
        <div id="album"></div>
      </div>
      <div id="track"></div>
      <div class="links">
        <a id="link-discogs" href="#" target="_blank">Discogs</a>
        <a id="link-youtube" href="#" target="_blank">YouTube</a>
      </div>
    </div>
  </div>

  <script>
    // ── Styles ──────────────────────────────────────
    const GENRE_STYLES = {
      'Electronic': [
        'Ambient','Bass Music','Breaks','Breakbeat','Deep House','Disco','Downtempo',
        'Drum n Bass','Dub Techno','Electro','EBM','Experimental','Footwork',
        'Grime','House','IDM','Industrial','Jungle','Minimal','Noise',
        'Synth-pop','Tech House','Techno','Trance','Trip Hop','UK Garage'
      ],
      'Jazz': [
        'Bebop','Bossa Nova','Cool Jazz','Free Jazz','Fusion',
        'Hard Bop','Jazz-Funk','Modal','Soul Jazz','Swing','Avant-garde Jazz'
      ],
      'Funk / Soul': [
        'Disco','Funk','Gospel','Neo Soul','R&B','Rare Groove','Soul','P.Funk'
      ],
      'Hip Hop': [
        'Abstract','Boom Bap','Conscious','Crunk','Gangsta','Grime',
        'Instrumental','Jazz-Rap','Lo-Fi','Trap','Trip Hop'
      ],
      'Rock': [
        'Alternative Rock','Art Rock','Folk Rock','Indie Rock','Krautrock',
        'Noise Rock','Post-Rock','Prog Rock','Psych Rock','Shoegaze','Soft Rock','Surf'
      ],
      'Classical': [
        'Baroque','Chamber Music','Contemporary','Impressionist',
        'Modern','Orchestral','Romantic','Symphonic'
      ],
      'Folk, World, & Country': [
        'African','Afrobeat','Brazilian','Celtic','Cumbia','Folk',
        'Latin','Reggae','Samba','World','Bossa Nova'
      ],
      'Blues': [
        'Chicago Blues','Country Blues','Delta Blues','Electric Blues','Rhythm & Blues'
      ],
      'Latin': [
        'Bossa Nova','Cumbia','Latin Jazz','Mambo','Salsa','Samba','Son','Tango'
      ],
      'Reggae': [
        'Dancehall','Dub','Lovers Rock','Roots Reggae','Ska','Rocksteady'
      ],
    };

    function renderStyles() {
      const checked = [...document.querySelectorAll('#genreList input:checked')].map(cb => cb.value);
      const section = document.getElementById('stylesSection');
      const list    = document.getElementById('styleList');

      if (checked.length === 0) {
        section.style.display = 'none';
        list.innerHTML = '';
        return;
      }

      const styles = [...new Set(checked.flatMap(g => GENRE_STYLES[g] || []))].sort();
      section.style.display = 'block';

      const prevChecked = new Set(
        [...document.querySelectorAll('#styleList input:checked')].map(cb => cb.value)
      );

      list.innerHTML = styles.map(s => `
        <label class="genre-check">
          <input type="checkbox" value="${s}"${prevChecked.has(s) ? ' checked' : ''}> ${s}
        </label>
      `).join('');
    }

    document.getElementById('genreList').addEventListener('change', renderStyles);

    // ── Presets ─────────────────────────────────────
    const PRESETS = [
      { id: 'todo',       label: 'Todo',        genres: [],                  yearFrom: 1960, yearTo: 2024, exclude: [] },
      { id: 'electronica',label: 'Electrónica', genres: ['Electronic'],      yearFrom: 1985, yearTo: 2024, exclude: [] },
      { id: 'hiphop',     label: 'Hip Hop',     genres: ['Hip Hop'],         yearFrom: 1988, yearTo: 2015, exclude: [] },
      { id: 'indie',      label: 'Indie / Alt', genres: ['Rock', 'Pop'],     yearFrom: 1990, yearTo: 2015, exclude: ['heavy metal', 'punk', 'hard rock', 'metal'] },
      { id: 'jazz',       label: 'Jazz',        genres: ['Jazz'],            yearFrom: 1950, yearTo: 1980, exclude: [] },
      { id: 'soul',       label: 'Soul & Funk', genres: ['Funk / Soul'],     yearFrom: 1960, yearTo: 1985, exclude: [] },
    ];

    let activePreset = null;

    function renderPresets() {
      const row = document.getElementById('presetsRow');
      row.innerHTML = PRESETS.map(p => `
        <button class="preset-chip${activePreset === p.id ? ' active' : ''}"
                onclick="applyPreset('${p.id}')">
          ${p.label}
        </button>
      `).join('');
    }

    function applyPreset(id) {
      const preset = PRESETS.find(p => p.id === id);
      if (!preset) return;

      activePreset = id;

      // Genres
      document.querySelectorAll('#genreList input[type="checkbox"]').forEach(cb => {
        cb.checked = preset.genres.includes(cb.value);
      });

      // Years
      document.getElementById('yearFrom').value = preset.yearFrom;
      document.getElementById('yearTo').value   = preset.yearTo;

      // Exclusions
      excludedTerms.length = 0;
      preset.exclude.forEach(t => excludedTerms.push(t));
      renderTags();

      renderStyles();
      renderPresets();
    }

    function clearActivePreset() {
      if (activePreset !== null) {
        activePreset = null;
        renderPresets();
      }
    }

    renderPresets();

    // Deselect preset when user manually changes filters
    document.addEventListener('change', function(e) {
      if (e.target.closest('#genreList, #styleList, #yearFrom, #yearTo')) clearActivePreset();
    });

    // ── Filters toggle ──────────────────────────────
    function toggleFilters() {
      const btn  = document.getElementById('filtersToggle');
      const body = document.getElementById('filtersBody');
      const open = body.classList.toggle('open');
      btn.classList.toggle('open', open);
    }

    // ── Background vinyl store photos (Unsplash) ───
    let bgActive = 'a';

    function loadBg() {
      const keywords = 'vinyl,record+store,record+shop,music+store';
      const url = `https://source.unsplash.com/1920x1080/?${keywords}&t=${Date.now()}`;
      const next = bgActive === 'a' ? 'b' : 'a';
      const nextEl = document.getElementById(`bg-${next}`);
      const currEl = document.getElementById(`bg-${bgActive}`);

      const img = new Image();
      img.onload = () => {
        nextEl.style.backgroundImage = `url(${img.src})`;
        nextEl.style.opacity = '1';
        currEl.style.opacity = '0';
        bgActive = next;
      };
      img.src = url;
    }

    loadBg();

    // ── Exclusion tags ──────────────────────────────
    const excludedTerms = [];

    function handleExcludeKey(e) {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        const val = e.target.value.trim().replace(/,$/, '');
        if (val) addExclusion(val);
        e.target.value = '';
      }
    }

    function addExclusion(term) {
      const normalized = term.toLowerCase();
      if (excludedTerms.includes(normalized)) return;
      excludedTerms.push(normalized);
      renderTags();
    }

    function removeExclusion(term) {
      const i = excludedTerms.indexOf(term);
      if (i !== -1) excludedTerms.splice(i, 1);
      renderTags();
    }

    function renderTags() {
      const container = document.getElementById('excludeTags');
      container.innerHTML = excludedTerms.map(t =>
        `<div class="tag">${t}<button onclick="removeExclusion('${t.replace(/'/g, "\\'")}')">×</button></div>`
      ).join('');
    }

    function isExcluded(release) {
      if (excludedTerms.length === 0) return false;
      const fields = [
        ...(release.genre  || []),
        ...(release.style  || []),
        ...(release.styles || []),
      ].map(s => s.toLowerCase());
      return excludedTerms.some(term => fields.some(f => f.includes(term)));
    }

    // ── API ─────────────────────────────────────────
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function cleanArtist(name) {
      return name.replace(/\s*\(\d+\)$/, '');
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    async function discogsGet(url) {
      const res = await fetch(url, {
        headers: { 'User-Agent': 'DiscogsRandomizer/1.0' }
      });
      if (res.status === 429) throw new Error('rate_limit');
      if (!res.ok) throw new Error(`http_${res.status}`);
      return res.json();
    }

    async function getRandomTrack() {
      const btn = document.getElementById('mainBtn');
      btn.disabled = true;
      setStatus('Buscando…');
      document.getElementById('card').style.display = 'none';
      loadBg();

      for (let attempt = 0; attempt < 5; attempt++) {
        try {
          const yearFrom      = parseInt(document.getElementById('yearFrom').value) || 1960;
          const yearTo        = parseInt(document.getElementById('yearTo').value)   || 2010;
          const checkedGenres  = [...document.querySelectorAll('#genreList input:checked')].map(cb => cb.value);
          const checkedStyles  = [...document.querySelectorAll('#styleList input:checked')].map(cb => cb.value);
          const genre = checkedGenres.length > 0
            ? checkedGenres[randInt(0, checkedGenres.length - 1)]
            : '';
          const style = checkedStyles.length > 0
            ? checkedStyles[randInt(0, checkedStyles.length - 1)]
            : '';
          const year = randInt(Math.min(yearFrom, yearTo), Math.max(yearFrom, yearTo));
          const page = randInt(1, 10);

          let searchUrl = `https://api.discogs.com/database/search?type=release&year=${year}&page=${page}&per_page=50`;
          if (genre) searchUrl += `&genre=${encodeURIComponent(genre)}`;
          if (style) searchUrl += `&style=${encodeURIComponent(style)}`;

          const search = await discogsGet(searchUrl);
          let results = search.results;
          if (!results || results.length === 0) continue;

          if (excludedTerms.length > 0) {
            results = results.filter(r => !isExcluded(r));
            if (results.length === 0) continue;
          }

          const release = results[randInt(0, results.length - 1)];
          const detail  = await discogsGet(`https://api.discogs.com/releases/${release.id}`);

          if (isExcluded(detail)) continue;

          let tracklist = (detail.tracklist || []).filter(
            t => t.type_ === 'track' && t.title && t.title.trim()
          );
          if (tracklist.length === 0) {
            tracklist = (detail.tracklist || []).filter(t => t.title && t.title.trim());
          }
          if (tracklist.length === 0) continue;

          const track = tracklist[randInt(0, tracklist.length - 1)];

          let imageUrl = null;
          if (detail.images && detail.images.length > 0) {
            imageUrl = detail.images[0].uri;
          } else if (release.cover_image && !release.cover_image.includes('spacer')) {
            imageUrl = release.cover_image;
          }

          let artistName = '';
          if (detail.artists && detail.artists.length > 0) {
            artistName = cleanArtist(detail.artists[0].name);
          } else if (release.title && release.title.includes(' - ')) {
            artistName = release.title.split(' - ')[0].trim();
          }

          const albumTitle = detail.title || release.title || '';
          const trackTitle = track.title;
          const discogsUrl = `https://www.discogs.com/release/${release.id}`;
          const ytQuery    = encodeURIComponent(`${artistName} ${albumTitle} ${trackTitle}`);
          const youtubeUrl = `https://www.youtube.com/results?search_query=${ytQuery}`;

          document.getElementById('artist').textContent = artistName;
          document.getElementById('album').textContent  = albumTitle;
          document.getElementById('track').textContent  = trackTitle;
          document.getElementById('link-discogs').href  = discogsUrl;
          document.getElementById('link-youtube').href  = youtubeUrl;

          const img         = document.getElementById('cover');
          const placeholder = document.getElementById('cover-placeholder');

          if (imageUrl) {
            img.onload  = () => { img.style.display = 'block'; placeholder.style.display = 'none'; };
            img.onerror = () => { img.style.display = 'none';  placeholder.style.display = 'flex'; };
            img.src = imageUrl;
          } else {
            img.style.display         = 'none';
            placeholder.style.display = 'flex';
          }

          document.getElementById('card').style.display = 'flex';
          setStatus('');
          btn.disabled = false;
          return;

        } catch (err) {
          if (err.message === 'rate_limit') {
            setStatus('Límite de API. Espera un momento.');
            btn.disabled = false;
            return;
          }
          await new Promise(r => setTimeout(r, 800));
        }
      }

      setStatus('Error al conectar. Intenta de nuevo.');
      btn.disabled = false;
    }
  </script>
