<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Randomizador</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #result {
      color: #777;
      font-size: 72px;
      text-align: center;
      margin-bottom: 40px;
      max-width: 90%;
    }

    button {
      background: none;
      border: 2px solid #777;
      color: #777;
      padding: 14px 28px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #777;
      color: #000;
    }
  </style>
</head>
